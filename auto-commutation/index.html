<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PMSM — автокоммутация</title>
    <link rel="stylesheet" href="../style.css">
  </head>
  <body>
    <!-- Полотно и то, что его окружает. На полотне рисуется только машина;
         надписи над ней, легенду, показания и панель управления строит
         Panel.js — повторять эту разметку в каждой странице режима значило
         бы править их все при любом её изменении. -->
    <main id="stage">
      <div id="app"></div>
    </main>

    <script>
      window.PMSM_PROFILE = "auto-commutation";
      window.PMSM_MACHINE = "pmsm";
      window.PMSM_START_PAUSED = true;
      window.PMSM_MOTOR_OPTIONS = { frictionEnabled: false, maximumInertia: true };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
    <script src="../version.js"></script>

    <script src="../InductionMotorModel.js"></script>
    <script src="../Controllers.js"></script>
    <script src="../Presets.js"></script>
    <script src="../Simulation.js"></script>
    <script src="../MotorView.js"></script>
    <script src="../Panel.js"></script>
    <script src="../Help.js"></script>
    <script src="../Diagnostics.js"></script>
    <script src="../Updater.js"></script>
    <script src="../PMSMmodel.js"></script>
  </body>
</html>
