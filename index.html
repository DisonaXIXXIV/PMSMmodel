<!doctype html>
<!--
  Полная программа: режим управления выбирается кнопками в панели.

  Своего профиля страница не объявляет и поэтому принимает его из адреса —
  ?mode=vector, ?mode=manual-voltage и так далее (см. Presets.js). Страницы
  отдельных режимов лежат в подпапках manual-current/, manual-voltage/,
  open-loop/ и vector/; программа у всех одна, отличается только объявленный
  профиль.

  Разметки здесь ровно столько, сколько нужно полотну: весь интерфейс —
  и машина, и панель — рисуется на нём же средствами p5.js.
-->
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PMSM — визуальная модель синхронной машины</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Контейнер полотна. Его размер и есть размер полотна: высота задана в
         style.css динамическими единицами (100dvh), поэтому на телефоне она
         учитывает сворачивающуюся адресную строку. Полотно ищет этот элемент
         по идентификатору (см. setup в PMSMmodel.js). -->
    <!-- Полотно и то, что его окружает. На полотне рисуется только машина;
         надписи над ней, легенду, показания и панель управления строит
         Panel.js — повторять эту разметку в каждой странице режима значило
         бы править их все при любом её изменении. -->
    <main id="stage">
      <div id="app"></div>
    </main>

    <!-- Сборки нет: файлы подключаются по одному и в порядке зависимостей.
         Классы должны быть объявлены раньше, чем их создаст PMSMmodel.js,
         поэтому он идёт последним, а Theme.js — первым: он выставляет тему до
         первого кадра, и светлая тема не начинается со вспышки тёмного фона.

         Тот же список повторяется в index.html каждой страницы режима: новый
         файл .js нужно подключить во всех пяти. -->
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
    <script src="version.js"></script>
    <script src="Theme.js"></script>
    <script src="MathUtils.js"></script>
    <script src="MotorModel.js"></script>
    <script src="Controllers.js"></script>
    <script src="Presets.js"></script>
    <script src="Simulation.js"></script>
    <script src="MotorView.js"></script>
    <script src="Panel.js"></script>
    <script src="Diagnostics.js"></script>
    <script src="Updater.js"></script>
    <script src="PMSMmodel.js"></script>
  </body>
</html>
