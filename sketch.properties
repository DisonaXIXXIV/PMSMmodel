# Настройки скетча для Processing 4. Файл нужен только запуску из Processing:
# он говорит, что это скетч в режиме p5.js (experimental), и какой файл
# главный. Имя главного файла обязано совпадать с именем папки скетча —
# поэтому точка входа называется PMSMmodel.js и переименовать её нельзя.
# В браузере этот файл не читается: там порядок скриптов задаёт index.html.
main=PMSMmodel.js
mode=p5.js
mode.id=processing.p5js.p5js
