<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PMSM — векторное управление</title>
    <link rel="stylesheet" href="../style.css">
  </head>
  <body>
    <main id="app"></main>

    <!-- Страница одного режима: векторное управление. Код тот же, что и у полной
         программы в корне проекта, и скрипты берутся оттуда же — здесь нет ни
         одной своей строки кода. Отличается только профиль, объявленный ниже:
         он фиксирует режим и убирает переключатели, которые в нём ничего не
         меняют, поэтому по ссылке сразу открывается нужный режим и выйти из
         него нельзя. Объявить профиль нужно до PMSMmodel.js, который читает
         его в setup(). Профили описаны в ../Presets.js. -->
    <script>window.PMSM_PROFILE = "vector";</script>

    <!-- Порядок тот же, что в корневом index.html, и список тот же: новый
         файл .js подключается во всех пяти страницах. -->
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
    <script src="../Theme.js"></script>
    <script src="../MathUtils.js"></script>
    <script src="../MotorModel.js"></script>
    <script src="../Controllers.js"></script>
    <script src="../Presets.js"></script>
    <script src="../Simulation.js"></script>
    <script src="../MotorView.js"></script>
    <script src="../GUI.js"></script>
    <script src="../Diagnostics.js"></script>
    <script src="../PMSMmodel.js"></script>
  </body>
</html>
